<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Calculator Test</title>
</head>
<body>
    <h1>API Calculator</h1>
    <p>Input a number</p>
    
    <input type="number" id="numberInput" placeholder="输入数字">
    <button id="addButton">send to server</button>
    
    <div class="result">
        current sum: <span id="totalSum"></span>
    </div>
    <div class="status" id="statusMsg">Connecting to server</div>

    <script>
        const API_URL = "http://localhost:5262/number"; 

        const totalSumDisplay = document.getElementById('totalSum');
        const statusMsg = document.getElementById('statusMsg');
        const numberInput = document.getElementById('numberInput');
        const addButton = document.getElementById('addButton');

        let currentSum = 0;

        // get the current sum when page open (GET)
        async function fetchSum() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("fail");
                
                const data = await response.json();
                currentSum = data; // update new number
                totalSumDisplay.textContent = currentSum;
                statusMsg.textContent = "number loaded successfully";
            } catch (error) {
                console.error(error);
                totalSumDisplay.textContent = "---";
                statusMsg.textContent = "unable to connect to server";
            }
        }

        // when click button send number to server
        addButton.addEventListener('click', async () => {
            const inputVal = parseInt(numberInput.value);

            // calculate new sum
            const newSum = currentSum + inputVal;
            statusMsg.textContent = "saving...";

            try {
                const response = await fetch(`${API_URL}?number=${newSum}`, {
                    method: 'POST'// send new sum to server
                });

                if (response.ok) {
                    currentSum = newSum;
                    totalSumDisplay.textContent = currentSum;
                    numberInput.value = ""; // clear input
                    statusMsg.textContent = "data saving to server successfully";
                } else {
                    throw new Error("error in saving data");
                }
            } catch (error) {
                console.error(error);
                statusMsg.textContent = "fail";
            }
        });

        fetchSum();
    </script>
</body>
</html>
